<fieldset class="otp-field">
  <legend>{{ 'auth.otp.label' | translate }}</legend>
  <div class="otp-field__inputs" dir="ltr" (paste)="paste($event)">
    @for (digit of digits(); track $index) {
      <input
        #otpInput
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="one-time-code"
        maxlength="1"
        [attr.aria-label]="('auth.otp.digit' | translate) + ' ' + ($index + 1)"
        [value]="digit"
        [disabled]="disabled()"
        (input)="updateDigit($index, $event)"
        (keydown)="handleKeydown($index, $event)"
        (blur)="handleBlur()">
    }
  </div>
  @if (error()) {
    <p class="otp-field__error">{{ error() }}</p>
  }
</fieldset>

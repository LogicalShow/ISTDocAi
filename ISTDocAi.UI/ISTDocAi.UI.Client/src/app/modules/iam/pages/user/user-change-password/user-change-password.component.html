<div class="user-password">
  <header class="user-password__header">
    <h2 class="user-password__title">{{ 'user.changePassword.title' | translate }}</h2>
    <button type="button" class="user-password__close" [attr.aria-label]="'common.close' | translate" (click)="cancel()">
      <app-icon name="x-light" [width]="20" [height]="20" />
    </button>
  </header>

  <form [formGroup]="form" (ngSubmit)="save()" autocomplete="off">
    <div class="user-password__content">
      <div class="user-password__readonly-field">
        <span class="user-password__label">{{ 'user.edit.userNameLabel' | translate }}</span>
        <div class="user-password__readonly-value">{{ user.UserName }}</div>
      </div>

      <app-new-password-fields
        idPrefix="user-password"
        [newPasswordControl]="form.controls.newPassword"
        [policy]="passwordPolicy()"
        [policyLoading]="isPasswordPolicyLoading()" />
    </div>

    <footer class="user-password__footer">
      <app-button hierarchy="gray-outline" [disabled]="isLoading()" (clicked)="cancel()">
        {{ 'common.cancel' | translate }}
      </app-button>
      <app-button type="submit" hierarchy="primary" [loading]="isLoading()"
        [loadingLabel]="'user.changePassword.submitting' | translate" [disabled]="!passwordPolicy()">
        {{ 'user.changePassword.submit' | translate }}
      </app-button>
    </footer>
  </form>
</div>

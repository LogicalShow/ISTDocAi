title = "DocAi: default rules with exact published test-vector exceptions"
[extend]
useDefault = true

# Published HMAC test vector in contract tests; not a deployment credential.
[[allowlists]]
description = "Published contract HMAC vector"
condition = "AND"
paths = ['''^ISTDocAi.Application.Tests/DocAi/Contracts/ContractTests\.cs$''']
regexTarget = "match"
regexes = ['''ZG9jYWktdGVzdC12ZWN0b3Itc2VjcmV0LTMyYnl0ZXM=?''']

# Same published HMAC vector ("docai-test-vector-secret-32bytes") in webhook and contract test fixtures.
[[allowlists]]
description = "Published vector in test fixtures"
condition = "AND"
paths = ['''^ISTDocAi\.(Infrastructure|UI\.Server|Application)\.Tests/Fixtures/''']
regexTarget = "match"
# gitleaks also reports the base64-decoded form, so allow both spellings of the same published vector.
regexes = ['''ZG9jYWktdGVzdC12ZWN0b3Itc2VjcmV0LTMyYnl0ZXM=?''', '''docai-test-vector-secret-32bytes''']

# Golden outputs of the retired deploy scripts (removed 2026-11-14; still in history). They hold SHA-256 hashes of
# test keys, never keys.
[[allowlists]]
description = "Retired deploy golden fixtures (history only)"
paths = ['''^ISTDocAi\.Infrastructure\.Tests/Fixtures/Deploy/''']

# Same published HMAC vector reused by worker test doubles.
[[allowlists]]
description = "Published vector in worker doubles"
condition = "AND"
paths = ['''^ISTDocAi.Infrastructure.Tests/Worker/WebhookFakes\.cs$''', '''^ISTDocAi.Infrastructure.Tests/Runtime/WebhookFakes\.cs$''']
regexTarget = "match"
regexes = ['''ZG9jYWktdGVzdC12ZWN0b3Itc2VjcmV0LTMyYnl0ZXM=?''']

# Azure built-in role definition id "Key Vault Secrets User" (public, identical in every tenant), stored under the
# bicep role map key `secrets`. Not a credential.
[[allowlists]]
description = "Azure built-in role id Key Vault Secrets User"
condition = "AND"
paths = ['''^tools/azure/infra/main\.bicep$''', '''^tools/azure/infra/main\.json$''']
regexTarget = "match"
regexes = ['''4633458b-17de-408a-b874-0445c86b69e6''']
